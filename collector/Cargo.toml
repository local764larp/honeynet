[package]
name = "honeynet-collector"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Central collector for the honeynet deception platform"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
async-trait = "0.1"
async-nats = "0.38"
futures = "0.3"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
hex = "0.4"
url = "2"
clap = { version = "4", features = ["derive", "env"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "macros"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
maxminddb = "0.24"

[build-dependencies]
prost-build = "0.13"
# Vendors a protoc binary so the collector builds on a machine with no
# system protobuf compiler. Without it, `cargo build` becomes environment
# dependent, which is exactly the failure mode that bites in CI.
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# NATS configuration for the honeynet collector.
#
# This file is where design doc section 4.4 is actually enforced. Everything
# else about node isolation is a claim; the `permissions` blocks below are the
# mechanism.
#
# Each sensor authenticates with a client certificate and is granted:
#   - publish  ONLY to honeynet.events.<its own node_id>.>
#   - subscribe to NOTHING
#
# Consequence: compromising a sensor buys an attacker the ability to lie about
# that sensor's own observations, and nothing more. It cannot read the fleet's
# traffic, cannot forge another node's events, and cannot discover which other
# sensors exist. The collector additionally cross-checks the envelope's
# self-reported node_id against the authenticated subject, so even the lying is
# confined to content rather than attribution.

listen: 0.0.0.0:4222
server_name: honeynet-collector-1

# Mutual TLS is mandatory. verify_and_map ties the certificate's CN to the
# `user` field below, which is what makes per-node permissions possible.
tls {
  cert_file: "/etc/nats/certs/server-cert.pem"
  key_file:  "/etc/nats/certs/server-key.pem"
  ca_file:   "/etc/nats/certs/ca.pem"
  verify:    true
  verify_and_map: true
  timeout:   5
}

jetstream {
  store_dir: "/var/lib/nats/jetstream"
  max_memory_store: 1G
  max_file_store: 100G
}

max_payload: 8MB
max_connections: 4096
write_deadline: "10s"

authorization {
  # ---------------------------------------------------------------------
  # Sensors. One entry per node, generated by provision-node.sh.
  #
  # The subject template is honeynet.events.<node_id>.> and the node_id must
  # equal the certificate CN. Adding a node means adding a block here and
  # reloading; there is deliberately no wildcard sensor identity, because a
  # shared credential would let any compromised sensor impersonate any other.
  # ---------------------------------------------------------------------

  users: [
    {
      user: "sensor-fra-01"
      permissions: {
        publish: {
          allow: ["honeynet.events.sensor-fra-01.>"]
        }
        # Empty allow list, not an omitted key. Omitting `subscribe` grants
        # everything; this denies everything.
        subscribe: {
          allow: []
        }
      }
    }

    {
      user: "sensor-nyc-07"
      permissions: {
        publish:   { allow: ["honeynet.events.sensor-nyc-07.>"] }
        subscribe: { allow: [] }
      }
    }

    # ---------------------------------------------------------------------
    # The collector. Subscribes to the whole fleet, publishes nothing.
    # ---------------------------------------------------------------------
    {
      user: "collector"
      permissions: {
        publish:   { allow: [] }
        subscribe: { allow: ["honeynet.events.>", "_INBOX.>"] }
      }
    }
  ]
}

# Operational endpoints, bound to loopback so they are not part of the
# internet-facing surface.
http: 127.0.0.1:8222

debug: false
trace: false
logtime: true
log_file: "/var/log/nats/nats-server.log"

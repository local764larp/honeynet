#!/usr/sbin/nft -f
#
# Egress containment for a honeypot sensor.
#
# Design doc section 4.3. The rule that matters is the OUTPUT policy: a sensor
# may reach its collector and a pinned resolver, and nothing else.
#
# This is not hardening in the ordinary sense. Attackers routinely test a
# compromised host by bouncing traffic through it, and a sensor that forwards
# makes its operator a link in someone else's attack chain -- which generates
# the abuse reports that get honeypot fleets terminated. Default-deny makes
# that structurally impossible rather than merely discouraged.
#
# Substitute COLLECTOR_IP, COLLECTOR_PORT, RESOLVER_IP and ADMIN_CIDR at
# provisioning time.

flush ruleset

define collector_ip   = COLLECTOR_IP
define collector_port = COLLECTOR_PORT
define resolver_ip    = RESOLVER_IP
define admin_cidr     = ADMIN_CIDR
define admin_ssh_port = 61022

table inet honeynet {

    # ------------------------------------------------------------ input --
    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        # Administration reaches the real sshd on a high port, restricted to
        # operator source addresses. The honeypot owns :22.
        ip saddr $admin_cidr tcp dport $admin_ssh_port accept

        # Honeypot listeners. Deliberately wide open -- this is the product.
        tcp dport { 22, 23, 80, 443, 3389 } accept

        # Rate limit new connections per source so one aggressive scanner
        # cannot crowd out every other actor and bias the corpus toward
        # whoever is loudest.
        tcp flags syn tcp dport { 22, 23, 80, 443, 3389 } \
            meter conn_rate { ip saddr limit rate over 30/second burst 60 packets } drop

        # ICMP echo only, rate limited. Silence is itself a fingerprint: a
        # host that answers nothing looks like a filtered honeypot.
        ip protocol icmp icmp type echo-request limit rate 5/second accept

        counter comment "input dropped"
    }

    # --------------------------------------------------------- forward --
    chain forward {
        # A sensor is never a router. This is the anti-relay guarantee.
        type filter hook forward priority filter; policy drop;
        counter comment "forward dropped -- sensor must never relay"
    }

    # ---------------------------------------------------------- output --
    chain output {
        type filter hook output priority filter; policy drop;

        oif lo accept
        ct state established,related accept

        # The collector. The only destination a sensor legitimately initiates
        # a connection to.
        ip daddr $collector_ip tcp dport $collector_port accept

        # DNS to a single pinned resolver, needed to resolve the collector
        # when it is configured by name.
        ip daddr $resolver_ip udp dport 53 accept
        ip daddr $resolver_ip tcp dport 53 accept

        # NTP. Clock drift makes cross-node correlation unreliable, though the
        # collector never trusts node timestamps for ordering regardless.
        udp dport 123 accept

        # Administrative package updates are NOT permitted from the running
        # sensor. Patch by redeploying the image; a box that can reach a
        # package mirror can reach anything that mirror can be tricked into
        # proxying.

        counter comment "egress dropped -- see design doc 4.3"
        log prefix "honeynet-egress-drop: " level warn limit rate 10/minute
    }
}

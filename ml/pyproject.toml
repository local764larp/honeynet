[project]
name = "honeynet-ml"
version = "0.1.0"
description = "Attacker profiling pipeline for the honeynet deception platform"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    # HDBSCAN ships in scikit-learn from 1.3, which avoids depending on the
    # standalone package and its compilation step.
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# UMAP gives better-separated embeddings than SVD but pulls in numba, which is
# a heavy and platform-sensitive dependency. The pipeline detects it at runtime
# and falls back to TruncatedSVD, so this is genuinely optional.
umap = ["umap-learn>=0.5"]
dev = ["pytest>=8.0"]

[project.scripts]
honeynet-ml = "honeynet_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honeynet_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
